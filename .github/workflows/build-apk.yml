
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch chess libraries and engine
        run: |
          mkdir -p tools app/src/main/assets/www
          npm install --prefix tools --no-audit --no-fund chess.js@1.4.0 stockfish@19.0.1
          cp tools/node_modules/chess.js/dist/esm/chess.js app/src/main/assets/www/chess.js
          cp tools/node_modules/stockfish/bin/stockfish-19-lite-single.js app/src/main/assets/www/
          cp tools/node_modules/stockfish/bin/stockfish-19-lite-single.wasm app/src/main/assets/www/
          cp tools/node_modules/stockfish/Copying.txt app/src/main/assets/www/STOCKFISH-LICENSE.txt

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ChessStudyOverlay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
