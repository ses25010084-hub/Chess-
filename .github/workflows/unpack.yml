name: Extract Chess Project

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unpack.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir /tmp/chess-project
          unzip -q "$ZIP" -d /tmp/chess-project
          cp -a /tmp/chess-project/ChessStudyOverlay/. .
          rm -f .github/workflows/build-apk.yml
          rm "$ZIP"

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract ChessStudyOverlay project" || exit 0
          git push
          
