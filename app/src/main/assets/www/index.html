<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8"><title>Chess Study</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111923;color:#edf4f1;font:14px system-ui,sans-serif;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.sub{color:#9aabb8;font-size:11px}.board{width:min(100%,440px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);margin:8px auto;border:2px solid #40505e;border-radius:5px;overflow:hidden}.sq{display:grid;place-items:center;font-size:clamp(23px,7vw,42px);position:relative;user-select:none}.light{background:#e6e1d5;color:#17202a}.dark{background:#72917f;color:#17202a}.sel{outline:3px solid #f5cf65;outline-offset:-3px}.hint{background:#d6c66b!important}.controls{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.btn{background:#243545;border:1px solid #3c5366;color:#eff8f4;border-radius:8px;padding:9px 11px;font-weight:600}.primary{background:#287b65;border-color:#399c80}.field{width:100%;background:#1b2835;border:1px solid #405366;color:#eaf3f0;border-radius:7px;padding:9px;margin:4px 0}.stat{background:#1b2835;border-radius:8px;padding:10px;margin-top:8px}.best{font-size:18px;color:#9ce2c8;font-weight:700}.small{font-size:11px;color:#9aabb8}.row{display:flex;gap:6px}.row>*{flex:1;min-width:0}#status{color:#e8cf82;min-height:18px;font-size:12px}.legal{font-size:10px;color:#82919d;margin-top:8px}
</style></head><body><div class="top"><div><b>CHESS STUDY</b><div class="sub">Offline analysis · Stockfish lite</div></div><div class="sub" id="engineState">Engine loading…</div></div><div id="board" class="board"></div><div class="controls"><button class="btn" id="flip">Flip</button><button class="btn" id="undo">Undo</button><button class="btn" id="reset">Start position</button><button class="btn primary" id="analyse">Analyse</button></div><div class="stat"><div class="small">ENGINE EVALUATION</div><div class="best" id="eval">—</div><div id="bestmove">Best move: —</div><div class="small" id="lines">Depth: —</div></div><div class="small" style="margin-top:10px">Load a position</div><input class="field" id="fen" placeholder="Paste FEN here"><div class="controls"><button class="btn" id="loadFen">Load FEN</button><button class="btn" id="copyFen">Copy FEN</button></div><textarea class="field" id="pgn" rows="3" placeholder="Paste PGN for review"></textarea><div class="controls"><button class="btn" id="loadPgn">Load PGN</button></div><div id="status">Tap a piece, then tap its destination square.</div><div class="legal">For practice and post-game review only. No live-game reading, move automation, or platform interaction.</div>
<script type="module" src="app.js"></script></body></html>
